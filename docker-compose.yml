services:
  fastslides:
    build: .
    ports:
      - "5013:5013"
    environment:
      FASTSLIDES_DB: /data/fastslides.sqlite
      FASTSLIDES_PORT: "5013"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-xai}
      MODEL_NAME: ${MODEL_NAME:-grok-4-1-fast-reasoning}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      FASTSLIDES_ADMIN_PASSWORD: ${FASTSLIDES_ADMIN_PASSWORD:-FastSlides2026$$}
      FASTSLIDES_SECRET: ${FASTSLIDES_SECRET:-}
    volumes:
      - fastslides-data:/data
volumes:
  fastslides-data:
